spring.application.name=FInal_banking_app-test

# H2 in-memory database (test profile)
spring.datasource.url=jdbc:h2:mem:bank_database;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
#server.port=8080

# JWT Configuration (same as default)
app.jwt.secret=thisIsA32ByteLongSecretKeyForJWT!!
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
